@if (basket?.id == null) {
  <p class="text-center text-danger">your basket is empty</p>
} @else {
  <div class="container pt-4 flex-container">
    <div class="basket-container">
      <table class="table table-hover custom-table">
        <thead>
          <tr class="bg-info text-white">
            <th>Product</th>
            <th></th>
            <th>Description</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (item of basket.basketItems; track $index) {
            <tr>
              <td>
                <a
                  routerLink="/shop/product-details/{{ item.id }}"
                  class="text-dark text-decoration-none"
                  >{{ item.name }}</a
                >
              </td>
              <td>
                <img
                  [src]="'https://localhost:44349' + item.image"
                  alt=""
                  class="product-image img-fluid"
                />
              </td>
              <td class="description">
                {{ item.description }}
              </td>
              <td>{{ item.price | currency: 'YER' }}</td>
              <td>
                <button (click)="incrementQuantity(item)" class="btn btn-sm text-info">
                  <i class="fa fa-plus"></i>
                </button>
                <span class="mx-2">{{ item.qunatity }}</span>
                <button (click)="decrementQuantity(item)" class="btn btn-sm text-danger">
                  <i class="fa fa-minus"></i>
                </button>
              </td>
              <td>{{ item.qunatity * item.price | currency: 'YER' }}</td>
              <td>
                <button (click)="removeBasket(item)" class="btn btn-danger">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
