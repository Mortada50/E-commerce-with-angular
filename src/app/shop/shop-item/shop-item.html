<div class="product-item">
  <div class="card h-100">
    <div class="product-image">
      <img
        src="https://localhost:44349/{{ productItem.photo[0]?.imageName }}"
        alt=""
        class="card-img-top"
      />
    </div>
    <div class="card-body">
      <div class="thumbnails mb-3">
        @for (item of productItem.photo; track $index) {
          <img
            src="https://localhost:44349/{{ item.imageName }}"
            alt="imgae"
            class="thumbnail-img small-img"
          />
        }
      </div>
      <h5 class="card-title">{{ productItem.name }}</h5>
      <p class="card-text">
        {{ productItem.description }}
      </p>
      <p class="price">
        <span class="old-price">{{ productItem.oldPrice | currency: 'YRE' }}</span>
        {{ productItem.newPrice | currency: 'YRE' }}
      </p>
      <div class="rating mb-3"></div>
      <button class="btn btn-outline-primary favorite-icon">
        <i class="fa fa-bookmark"></i>
      </button>
      <div class="d-flex justify-content-between align-items-start">
        <button class="btn btn-dark"><i class="fa fa-shopping-cart"></i>Add to Cart</button>
        <button class="btn btn-success"><i class="fa fa-info-circle"></i>Details</button>
      </div>
    </div>
  </div>
</div>
