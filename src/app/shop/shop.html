<div class="container mt-5">
  <div class="row">
    <h1 class="main-title">Shopping</h1>
    <section class="col-md-3">
      <div class="sidebar">
        <h4 class="section-title">Sorting</h4>
        <div class="custom-select-wrapper mb-4">
          <select #SortSelected name="" id="" class="form-select" (change)="SortingByPrice($event)">
            @for (item of SortingOption; track $index) {
              <option [value]="item.value">{{ item.name }}</option>
            }
          </select>
        </div>
        <h4 class="section-title">Categories</h4>
        <ul class="list-group custom-list-group">
          @for (category of categories; track $index) {
            <li
              [class.active]="category.id == ProductParam.categoryId"
              (click)="selectedCategory(category.id)"
              class="list-group-item custom-list-item"
            >
              {{ category.name }}
            </li>
          }
        </ul>
      </div>
    </section>
    <section class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="paging-container">
          <span class="text-dark"
            >showing {{ products.length }} of
            {{ ProductParam.pageNumber * ProductParam.pageSize }}</span
          >
        </div>
        <div class="search-container">
          <div class="input-group sear">
            <input
              #search
              (keyup)="onSearch(search.value)"
              (keyup.enter)="onSearch(search.value)"
              type="text"
              class="form-control"
              placeholder="Search..."
            />
            <input
              (click)="onSearch(search.value)"
              type="button"
              class="btn btn-danger"
              value="Search"
            />
            <input (click)="onReset()" type="button" class="btn btn-dark" value="Reset" />
          </div>
        </div>
      </div>
      <div class="row g-4">
        @for (product of products; track $index) {
          <ng-container>
            <app-shop-item class="col-lg-4 col-md-6" [productItem]="product"></app-shop-item>
          </ng-container>
        }
        <div class="d-flex justify-content-center align-items-center mt-5">
          <app-pagnation
            [pageSize]="ProductParam.pageSize"
            [totalCount]="TotalCount"
            (pageChange)="onChangePage($event)"
          ></app-pagnation>
        </div>
      </div>
    </section>
  </div>
</div>
